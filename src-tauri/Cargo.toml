[package]
name = "scratchcli"
version = "0.1.1"
description = "ScratchCLI — local-first coding scratchpad + CLI"
authors = ["ScratchCLI contributors"]
edition = "2021"

[lib]
name = "scratchcli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["process", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
portable-pty = "0.9.0"
futures-util = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
